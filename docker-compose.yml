version: '3.8'

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: dev_workspace
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: p4sswd1
      POSTGRES_DB: devdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: